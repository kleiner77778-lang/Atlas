name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-dev ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libunwind-dev autoconf libtool pkg-config \
            libncurses5-dev libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Pre-download Android Command-Line Tools for Buildozer
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          cd /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ || true

          # Lizenzen vorab erstellen
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo "8933bac16c9d2af29705f148f4np912a5120a112" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131e6489e" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a43b682427c875a6980b8dadb9f5b5f88" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
