name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-dev ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libunwind-dev openjdk-17-jdk autoconf libtool pkg-config \
            libncurses5-dev libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Fix Buildozer spec for API 33 and Build Tools 33.0.1
        run: |
          # Falls buildozer.spec existiert, patchen wir die Versionen direkt
          if [ -f buildozer.spec ]; then
            sed -i 's/#android.api =.*/android.api = 33/' buildozer.spec
            sed -i 's/android.api =.*/android.api = 33/' buildozer.spec
            sed -i 's/#android.minapi =.*/android.minapi = 21/' buildozer.spec
            sed -i 's/android.minapi =.*/android.minapi = 21/' buildozer.spec
            sed -i 's/#android.build_tools_version =.*/android.build_tools_version = 33.0.1/' buildozer.spec
            sed -i 's/android.build_tools_version =.*/android.build_tools_version = 33.0.1/' buildozer.spec
          fi

      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
